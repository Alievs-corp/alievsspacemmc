<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eb9703" />

    <!--
      Baseline metadata for crawlers that do not execute JavaScript.
      `data-rh` hands ownership to react-helmet-async, which replaces these
      tags on mount instead of appending duplicates next to them.
    -->
    <title>Alievs Space — Web &amp; Mobile App Development Company</title>
    <meta data-rh="true"
      name="description"
      content="Alievs Space builds websites, online stores, mobile apps and custom platforms. Fixed prices from 690 AZN, launch in 2-8 weeks, SEO and support included. Free quote in 24 hours."
    />
    <link data-rh="true" rel="canonical" href="https://alievsspace.com/" />
    <meta data-rh="true" name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta name="author" content="Alievs Space MMC" />

    <meta data-rh="true" property="og:type" content="website" />
    <meta data-rh="true" property="og:site_name" content="Alievs Space" />
    <meta data-rh="true" property="og:title" content="Alievs Space — Web &amp; Mobile App Development Company" />
    <meta data-rh="true"
      property="og:description"
      content="Websites, online stores, mobile apps and custom platforms. Fixed prices, launch in 2-8 weeks, SEO and support included."
    />
    <meta data-rh="true" property="og:url" content="https://alievsspace.com/" />
    <meta data-rh="true" property="og:image" content="https://alievsspace.com/og-image.png" />
    <meta data-rh="true" name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.ico" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Self-hosted variable fonts for the public site (Latin + Azerbaijani). -->
    <link rel="preload" href="/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/archivo-latin-ext.woff2" as="font" type="font/woff2" crossorigin />
    <!--
      Theme is applied before first paint so a light-mode visitor never sees a
      dark flash. Keeps `alievs_space_theme` in sync with ThemeContext.
    -->
    <script>
      /* A reload always opens at the first section: the browser must not
         restore the old scroll position (the walk hero would start mid-way). */
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    </script>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('alievs_space_theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif; color: #1e1611; background: #f6f1e8">
        <h1>Alievs Space — Web &amp; Mobile App Development</h1>
        <p>
          We build websites, online stores, mobile applications and custom platforms. Fixed prices,
          launch in 2-8 weeks, SEO and support included.
        </p>
        <p>Email: info@alievsspace.com</p>
        <p>
          Phone — International: +421 952 480 349 · Azerbaijan: +994 51 700 35 00 ·
          Georgia: +995 577 271 352
        </p>
        <p>Please enable JavaScript to use the interactive version of this site.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
